name: "Newsletter"
# After each site deploy, schedule a Kit email for every new post and record its slug in _data/newsletter_sent.yml.
on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be sent"
        type: boolean
        default: true
      list_ids:
        description: "Only list the Kit form and segment ids"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "newsletter"
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: pip install pyyaml
      - name: Schedule emails
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python tools/newsletter.py ${{ inputs.list_ids && '--list-ids' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Record sent posts
        run: |
          git diff --quiet _data/newsletter_sent.yml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "newsletter: record sent posts" _data/newsletter_sent.yml
          git push
